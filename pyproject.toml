[project]
name = "notebooklm-st"
version = "0.1.0"
description = "YouTube 영상 질의응답 도구"
requires-python = ">=3.13"
dependencies = [
    "notebooklm-py==0.8.1",
    "streamlit>=1.63.0",
    "yt-dlp>=2026.8.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notebooklm_st"]

[tool.ruff]
target-version = "py313"
line-length = 80
# ruff 는 마크다운 안의 파이썬 코드 블록도 포맷한다. 기획서·계획서·규칙
# 문서의 예시 코드가 검증을 돌릴 때마다 바뀌므로 대상에서 뺀다.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "UP", "B", "SIM", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.13"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["notebooklm_st.core.*", "notebooklm_st.services.*"]
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    # 데스크톱에서 notebooklm login 을 돌리는 데 필요하다. 컨테이너
    # 이미지는 uv sync --no-dev 로 이것을 뺀다.
    "notebooklm-py[browser]==0.8.1",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
