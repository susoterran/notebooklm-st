# 이미지를 이 호스트에 붙인다. 앱 환경변수는 이미지에 있으므로
# 여기서 다시 적지 않는다 — 두 곳에 적으면 어긋난다. 예외는
# Outline 연결값이다. 토큰이 시크릿이라 이미지에 구울 수 없다.
services:
  app:
    build: .
    image: notebooklm-st:local
    container_name: notebooklm-st
    # 홈서버 사용자의 UID 가 1000 이 아니면 PUID/PGID 로 덮는다.
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      # 이미지에 굽지 않는다 — 토큰은 시크릿이다. 값은 배포
      # 디렉터리의 compose 환경 파일에서 온다. 비어 있으면 앱은
      # 뜨되 저장 버튼 자리에 안내가 나온다.
      NOTEBOOKLM_ST_OUTLINE_URL: "${NOTEBOOKLM_ST_OUTLINE_URL:-}"
      NOTEBOOKLM_ST_OUTLINE_TOKEN: "${NOTEBOOKLM_ST_OUTLINE_TOKEN:-}"
      NOTEBOOKLM_ST_OUTLINE_COLLECTION: "${NOTEBOOKLM_ST_OUTLINE_COLLECTION:-}"
      # 선택. 앱이 붙는 주소와 사람이 브라우저로 여는 주소가 다를 때만
      # 채운다. 비우면 위 URL 을 그대로 링크에 쓴다.
      NOTEBOOKLM_ST_OUTLINE_PUBLIC_URL: "${NOTEBOOKLM_ST_OUTLINE_PUBLIC_URL:-}"
      # 선택. 원격 구글 로그인 화면(login-browser)의 주소. 사용자
      # 브라우저가 닿는 홈서버 주소여야 한다(예: http://192.168.0.10:9005).
      # 비우면 인증 페이지에 원격 로그인 영역이 나오지 않는다.
      NOTEBOOKLM_ST_LOGIN_VIEWER_URL: "${NOTEBOOKLM_ST_LOGIN_VIEWER_URL:-}"
    ports:
      # 호스트 9004 → 컨테이너 8611. 홈 LAN 에만 연다.
      # 인터넷에 포워딩하지 않는다(스펙 6절).
      - "9004:8611"
    volumes:
      # 쿠키 회전이 여기에 되쓰인다. :ro 를 걸면 재시작마다 옛
      # 쿠키로 돌아가고 결국 죽는다.
      - ./data:/data
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 원격 구글 로그인 사이드카. 평소에는 감시 루프만 돌고, 인증
  # 페이지에서 로그인을 시작하면 크로미움과 화면 중계를 띄운다.
  # 설계: docs/superpowers/specs/2026-09-26-remote-login-design.md
  login-browser:
    build:
      context: .
      dockerfile: deploy/login-browser/Dockerfile
    image: notebooklm-st-login-browser:local
    container_name: notebooklm-st-login-browser
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      # 호스트 9005 → noVNC 6080. 홈 LAN 에만 연다. 로그인 세션 중에만
      # 무언가가 이 포트를 듣는다. 인터넷에 포워딩하지 않는다.
      - "9005:6080"
    volumes:
      # 앱과 같은 볼륨. 로그인 결과가 앱의 프로필에 바로 떨어진다.
      - ./data:/data
    restart: unless-stopped
    # 내려갈 때 세션의 프로세스 그룹 4개를 SIGTERM·SIGKILL 로 각각
    # 5초씩 기다리며 정리한다. 도커 기본 유예 10초면 정리 도중
    # SIGKILL 되어 크로미움 프로필(자격증명)이 볼륨에 남을 수 있다.
    stop_grace_period: 30s
    read_only: true
    tmpfs: ["/tmp"]
    # 크로미움은 공유 메모리를 많이 쓴다. 기본 64MB 면 탭이 죽는다.
    shm_size: "1gb"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
