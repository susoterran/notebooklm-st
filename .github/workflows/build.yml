name: build

on:
  release:
    types: [released]          # 정식 릴리스(프리릴리스 제외)에서 정식 배포 이미지
  workflow_dispatch:           # 수동 실행 시 테스트 배포 이미지(devel)

# 최소권한 기본값: 모든 잡의 GITHUB_TOKEN을 읽기전용으로 시작.
# image 잡만 packages:write로 승격.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # 이미지 빌드의 전제(needs). ci.yml 이 push 마다 같은 검증을 돌지만,
    # 릴리스는 별개 시점의 트리라 굽기 직전에 다시 한 번 세운다. 여기서
    # 걸리면 GHCR 에 아무것도 올라가지 않는다.
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      # uv 는 공식 설치 스크립트를 쓴다. 액션의 메이저 버전은 시간이
      # 지나면 바뀌는데 이 저장소는 CI 를 자주 손볼 곳이 아니다.
      - run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv sync --frozen
      # 로컬은 고치면서 돌지만 CI 는 고치는 대신 실패해야 한다.
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest

  image:
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      # sbom·provenance 첨부에는 docker-container 드라이버가 필요하다.
      # 러너 기본 드라이버(docker)로는 attestation을 만들 수 없다.
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        with:
          images: ghcr.io/susoterran/notebooklm-st
          flavor: latest=false          # latest는 아래에서 명시적으로만 부여
          tags: |
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=raw,value=devel,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=sha-
          # latest·devel은 롤링 태그라 태그만으로는 어느 소스인지 알 수 없다. 운영 중 컨테이너를
          # 커밋까지 역추적하는 근거를 이미지에 박아둔다.
          #   docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' <이미지>
          # created(빌드 시각, RFC3339)는 metadata-action이 자동 부여하므로 재선언하지 않는다.
          labels: |
            org.opencontainers.image.title=notebooklm-st
            org.opencontainers.image.description=YouTube 영상 질의응답 도구
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.event.release.tag_name || 'devel' }}

      # ── 취약점 스캔 게이트 ────────────────────────────────────────────────
      # push 전에 로컬로만 빌드해 스캔한다. 여기서 걸리면 GHCR에 아무것도 올라가지 않는다.
      # push를 먼저 하면 스캔이 실패해도 latest·devel 롤링 태그가 이미 취약한 이미지를
      # 가리키게 되므로, 게이트 역할을 하지 못한다.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          push: false
          tags: notebooklm-st:scan
      # 스캐너를 나눠 돌린다. 막는 것과 보여 주는 것은 다른 일이다.
      # version은 이 액션 SHA의 기본값과 같은 값을 명시한 것이다. 적어 두면
      # 나중에 액션 SHA를 올릴 때 스캐너 버전이 함께 바뀌는 일이 diff에
      # 드러난다. 규칙 세트가 바뀌면 코드를 안 고쳐도 게이트 색이 달라진다.
      - name: 취약점 스캔 게이트 (HIGH·CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: notebooklm-st:scan
          version: v0.70.0
          scanners: vuln
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          # 패치가 아직 없는 CVE는 제외한다. 고칠 수 없는 항목으로 게이트가 상시
          # 빨간 상태가 되면 아무도 결과를 보지 않게 된다.
          ignore-unfixed: true
          format: table

      # 시크릿은 막지 않고 보고만 한다. 이미지의 대부분은 venv 안의 제3자
      # 코드이고, 거기서 나오는 발견은 우리가 고칠 수 없다. 예컨대 yt-dlp의
      # extractor/shahid.py는 공개 API를 부르려고 자격증명을 코드에 박아 두는데,
      # 우리 시크릿이 아니라 회전도 삭제도 할 수 없다. 위 ignore-unfixed와 같은
      # 이유다 — 고칠 수 없는 항목으로 게이트를 세우면 아무도 결과를 보지 않는다.
      # 우리 코드에 시크릿이 들어가는 것은 커밋 전 점검이 막는다
      # (→ .claude/rules/commit-strategy.md).
      - name: 시크릿 스캔 (보고만, 게이트 아님)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: notebooklm-st:scan
          version: v0.70.0
          scanners: secret
          exit-code: '0'
          severity: 'HIGH,CRITICAL'
          format: table

      # ── 동작 게이트 ───────────────────────────────────────────────────────
      # 취약하지 않은 것과 실제로 도는 것은 다른 질문이다. 스캔이 통과해도
      # PYTHONPATH가 틀렸거나 /data에 쓰지 못하는 이미지는 게시되면 안 된다.
      # 스캔 빌드가 만든 바로 그 이미지에 compose 태그를 붙여, 홈서버와 같은
      # 설정(비root·read_only·tmpfs·볼륨)으로 돌려본다. 태그를 먼저 붙이므로
      # compose는 다시 굽지 않는다. 환경변수는 이미지에 박혀 있어 따로 주지 않는다.
      - run: docker tag notebooklm-st:scan notebooklm-st:local
      # compose의 user: 기본값과 맞춘다. 홈서버에서 사람이 밟는 chown 절차와 같다.
      - run: mkdir -p data && sudo chown 1000:1000 data

      - name: 앱 모듈이 런타임 이미지에서 임포트되는지
        run: |
          docker compose run --rm app python -c \
            "import notebooklm_st.components.auth_gate, notebooklm_st.pages.ask, notebooklm_st.services.nlm, notebooklm_st.session"

      - name: 볼륨에 DB 를 만들 수 있는지
        run: |
          docker compose run --rm app python -c \
            "from notebooklm_st.services import store; store.connect(store.default_db_path()).close()"

      - name: extras 가 빠졌는지 — import 가 실패해야 정상
        run: |
          set +e
          out=$(docker compose run --rm app python -c "import playwright" 2>&1)
          rc=$?
          set -e
          if [ "$rc" -ne 1 ]; then
            echo "예상 밖 종료코드 $rc — 이미지가 못 떴을 수 있다" >&2
            echo "$out" >&2
            exit 1
          fi
          if ! echo "$out" | grep -q "ModuleNotFoundError: No module named 'playwright'"; then
            echo "종료코드는 1 이지만 사유가 다르다" >&2
            echo "$out" >&2
            exit 1
          fi

      - name: 시간대가 KST 인지
        run: |
          docker compose run --rm app python -c \
            "import datetime, sys; \
             off = datetime.datetime.now().astimezone().utcoffset(); \
             sys.exit(0 if off.total_seconds() == 32400 else 1)"

      # ── 사이드카 게이트 ───────────────────────────────────────────────────
      # 사이드카는 게시하지 않는다. compose 가 홈서버에서 로컬로 굽는다.
      # 여기서는 굽히는지, 앱 의존성이 없는지, 앱과 notebooklm-py 버전이
      # 같은지, 그리고 기동 뒤 감시 루프가 heartbeat 를 갱신하는지만 본다.
      # 아래 기동 단계의 compose up 이 이 이미지를 쓴다.
      - name: 사이드카 이미지 빌드
        run: docker compose build login-browser

      - name: 사이드카가 감시 루프를 임포트하는지
        run: |
          docker compose run --rm --no-deps -T login-browser python -c \
            "import notebooklm_st.login_browser.supervisor"

      - name: 사이드카에 앱 의존성이 없는지 — import 가 실패해야 정상
        run: |
          set +e
          out=$(docker compose run --rm --no-deps -T login-browser python -c "import streamlit" 2>&1)
          rc=$?
          set -e
          if [ "$rc" -ne 1 ] || ! echo "$out" | grep -q "No module named 'streamlit'"; then
            echo "예상 밖 결과 (종료코드 $rc)" >&2
            echo "$out" >&2
            exit 1
          fi

      - name: 사이드카의 notebooklm-py 가 앱과 같은 버전인지
        run: |
          probe='import importlib.metadata as m; print(m.version("notebooklm-py"))'
          app=$(docker compose run --rm --no-deps -T app python -c "$probe" | tr -d '\r')
          side=$(docker compose run --rm --no-deps -T login-browser python -c "$probe" | tr -d '\r')
          echo "app=$app login-browser=$side"
          test -n "$app" && test "$app" = "$side"

      - name: 기동과 헬스체크
        run: |
          docker compose up -d
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9004/_stcore/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      # import 만으로는 루프가 도는지 모른다. 앱은 heartbeat 가 10초 넘게
      # 멈추면 "꺼져 있음" 으로 본다. 같은 기준으로 확인한다. 컨테이너 안
      # 에서 재야 볼륨 권한과 호스트 시계에 흔들리지 않는다.
      - name: 사이드카 감시 루프가 heartbeat 를 갱신하는지
        run: |
          probe='import os, pathlib, sys, time
          p = pathlib.Path(os.environ["NOTEBOOKLM_ST_LOGIN_DIR"], "heartbeat")
          sys.exit(0 if p.exists() and time.time() - p.stat().st_mtime <= 10 else 1)'
          for _ in $(seq 1 15); do
            if docker compose exec -T login-browser python -c "$probe"; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs login-browser
          exit 1

      - name: 정리
        if: always()
        run: docker compose down

      # ── 게시 ──────────────────────────────────────────────────────────────
      # 위 스캔 빌드와 컨텍스트·Dockerfile이 같으므로 레이어는 CACHED로 지나간다.
      # 재빌드가 아니다(잡 안에서 유지되는 buildx 캐시. cache-from/to와는 무관).
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true               # 구성 패키지 목록(SBOM)을 이미지에 첨부 → CVE 발생 시 영향 여부 즉시 조회
          provenance: mode=max     # 빌드 출처(커밋·워크플로우·러너) 기록 첨부
