name: ci

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]          # 통합 PR 은 master 로만 간다
  workflow_dispatch:            # 수동 확인용

# 이미지 빌드가 가장 비싼 job 이다. 같은 ref 에 연속으로 push 하면
# 앞선 런을 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      # 서드파티 액션의 메이저 버전을 추측하지 않는다. 공식 설치
      # 스크립트에는 고정할 버전이 없다.
      - run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv sync --frozen
      # 로컬은 고치면서 돌지만 CI 는 고치는 대신 실패해야 한다.
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      # compose 의 user: 기본값과 맞춘다. 홈서버에서 사람이 밟는
      # chown 절차와 같은 것이다.
      - run: mkdir -p data && sudo chown 1000:1000 data
      - run: docker compose build

      - name: 앱 모듈이 런타임 이미지에서 임포트되는지
        run: |
          docker compose run --rm app python -c \
            "import notebooklm_st.components.auth_gate, notebooklm_st.pages.ask, notebooklm_st.services.nlm, notebooklm_st.session"

      - name: 볼륨에 DB 를 만들 수 있는지
        run: |
          docker compose run --rm app python -c \
            "from notebooklm_st.services import store; store.connect(store.default_db_path()).close()"

      - name: extras 가 빠졌는지 — import 가 실패해야 정상
        run: |
          set +e
          out=$(docker compose run --rm app python -c "import playwright" 2>&1)
          rc=$?
          set -e
          if [ "$rc" -ne 1 ]; then
            echo "예상 밖 종료코드 $rc — 이미지가 못 떴을 수 있다" >&2
            echo "$out" >&2
            exit 1
          fi
          if ! echo "$out" | grep -q "ModuleNotFoundError: No module named 'playwright'"; then
            echo "종료코드는 1 이지만 사유가 다르다" >&2
            echo "$out" >&2
            exit 1
          fi

      - name: 시간대가 KST 인지
        run: |
          docker compose run --rm app python -c \
            "import datetime, sys; \
             off = datetime.datetime.now().astimezone().utcoffset(); \
             sys.exit(0 if off.total_seconds() == 32400 else 1)"

      - name: 기동과 헬스체크
        run: |
          docker compose up -d
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9004/_stcore/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: 정리
        if: always()
        run: docker compose down
